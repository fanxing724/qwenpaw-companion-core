name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: |
          python3 - <<'PYTHON'
          import json, os
          assert json.load(open('plugin.json'))['version'] == os.environ['GITHUB_REF_NAME'].removeprefix('v'), 'Tag and manifest version differ'
          PYTHON
          python3 scripts/package.py .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "companion-core-${{ steps.version.outputs.VERSION }}.zip"
          generate_release_notes: true
