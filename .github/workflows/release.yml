name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: |
          zip -r "companion-core-${{ steps.version.outputs.VERSION }}.zip" \
            plugin.py plugin.json requirements.txt \
            README.md SKILL.md CHANGELOG.md LICENSE \
            data/ ui/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "companion-core-${{ steps.version.outputs.VERSION }}.zip"
          generate_release_notes: true
