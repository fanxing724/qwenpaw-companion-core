name: Package and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version
        id: version
        run: |
          python3 - <<'PYTHON'
          import json, os
          version = json.load(open('plugin.json', encoding='utf-8'))['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and manifest version differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt fastapi httpx pytest
      - name: Validate backend and frontend
        run: |
          python3 -m pytest -q tests
          node --check ui/index.js
          node tests/frontend.cjs
      - name: Package plugin
        run: python3 scripts/package.py dist --dir
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: companion-core-${{ steps.version.outputs.version }}
          path: dist/companion-core-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
      # GitHub re-zips every artifact on download, so the ZIP artifact above
      # arrives double-wrapped and cannot be installed directly. Upload the
      # unpacked tree as well: its download is wrapped only once and carries
      # plugin.json at the archive root, ready for QwenPaw to install.
      - name: Upload single-wrap installable files
        uses: actions/upload-artifact@v4
        with:
          name: companion-core-${{ steps.version.outputs.version }}-installable
          path: dist/companion-core/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-core-${{ needs.package.outputs.version }}
          path: dist
      - name: Publish plugin ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: 陪伴核心 v${{ needs.package.outputs.version }}
          body_path: RELEASE.md
          files: dist/companion-core-${{ needs.package.outputs.version }}.zip
          fail_on_unmatched_files: true

  sync-release-docs:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep documentation on the release page, not as download attachments
        uses: actions/github-script@v7
        env:
          PLUGIN_VERSION: ${{ needs.package.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...repo, tag: `v${process.env.PLUGIN_VERSION}`,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info('No existing release for this version; nothing to sync.');
                return;
              }
              throw error;
            }
            for (const asset of release.assets) {
              if (['README.md', 'LICENSE'].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({...repo, asset_id: asset.id});
                core.info(`Removed standalone documentation attachment: ${asset.name}`);
              }
            }
            await github.rest.repos.updateRelease({
              ...repo, release_id: release.id,
              body: fs.readFileSync('RELEASE.md', 'utf8'),
            });
